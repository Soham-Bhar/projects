project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - projects/*/index.qmd

# Notebooks are committed with their outputs, so CI does not need a Python
# environment. Set this to true if you later want Quarto to re-execute them.
execute:
  enabled: false

website:
  title: "Soham Bhar"
  description: "Undergraduate physics: computational projects and laboratory work."
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: projects/quadruple-pendulum/index.qmd
        text: Quadruple Pendulum
      - href: projects/quantum-bouncer/index.qmd
        text: Quantum Bouncer
      - href: projects/experimental-physics/index.qmd
        text: Experimental Physics
    right:
      - icon: github
        href: https://github.com/Soham-Bhar/projects
        aria-label: GitHub
  page-footer:
    center: "Code MIT-licensed. Written content CC BY-NC-ND 4.0."

format:
  html:
    theme: lab-notebook.scss
    toc: true
    css: styles.css
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
    include-after-body:
      - text: |
          <script>
          // Reveal-on-scroll, kept mechanical: a rule laid down, an entry settling once.
          // Everything here is progressive. With JS off, or with reduced motion asked for,
          // the page renders complete and static.
          (function () {
            var reduce = window.matchMedia &&
                         window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            var targets = document.querySelectorAll('main h2, .reveal');
            if (!targets.length) return;

            // No IntersectionObserver, or motion declined: show everything immediately.
            if (reduce || !('IntersectionObserver' in window)) {
              targets.forEach(function (el) { el.classList.add('is-in'); });
              return;
            }

            var io = new IntersectionObserver(function (entries) {
              entries.forEach(function (e) {
                if (!e.isIntersecting) return;
                e.target.classList.add('is-in');
                io.unobserve(e.target);          // once only, never on the way back up
              });
            }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });

            targets.forEach(function (el) { io.observe(el); });
          })();

          </script>
